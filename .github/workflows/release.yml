name: release

# Publish a release when a semver tag (vX.Y.Z) is pushed.
# Triggers on tags like v1.0.0. Pre-release tags (e.g. v1.0.0-rc1) are
# intentionally NOT matched. Add '*' to the pattern if you want them.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # required by softprops/action-gh-release to create the release

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Resolve version
        id: ver
        # GITHUB_REF_NAME is the tag name, e.g. v1.0.0
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Build all four targets. The module has no external dependencies, so no
      # `go mod download` is needed. The binary is named `notion` to match the
      # README usage examples; the CLI version is injected via ldflags.
      - name: Build (darwin/amd64)
        env:
          GOOS: darwin
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o notion .
          tar -czf dist/notion_${{ steps.ver.outputs.version }}_darwin_amd64.tar.gz notion README.md
      - name: Build (darwin/arm64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o notion .
          tar -czf dist/notion_${{ steps.ver.outputs.version }}_darwin_arm64.tar.gz notion README.md
      - name: Build (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o notion .
          tar -czf dist/notion_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz notion README.md
      - name: Build (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o notion .
          tar -czf dist/notion_${{ steps.ver.outputs.version }}_linux_arm64.tar.gz notion README.md

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/notion_${{ steps.ver.outputs.version }}_darwin_amd64.tar.gz
            dist/notion_${{ steps.ver.outputs.version }}_darwin_arm64.tar.gz
            dist/notion_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz
            dist/notion_${{ steps.ver.outputs.version }}_linux_arm64.tar.gz
            dist/checksums.txt
